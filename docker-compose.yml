services:
  postgres:
    image: postgres:16-alpine
    container_name: bi_platform_pg
    restart: unless-stopped
    environment:
      # Bootstrap superuser; the app + owner roles are created by init SQL below.
      POSTGRES_USER: bi_super
      POSTGRES_PASSWORD: bi_super_pw
      POSTGRES_DB: bi_platform
    ports:
      # 5433 on host to avoid colliding with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - bi_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_super -d bi_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bi_pgdata:
